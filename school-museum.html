<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#152923"><meta name="description" content="Прогулка по школьному музею Мухавца. История края, память о войне и предметы повседневной жизни."><title>Школьный музей Мухавца — прогулка</title><link rel="stylesheet" href="museum.css?v=6"><link rel="stylesheet" href="portal.css?v=1"><link rel="stylesheet" href="museum-glass.css?v=1"><link rel="stylesheet" href="journey.css?v=8"><link rel="stylesheet" href="research.css?v=4"><link rel="stylesheet" href="walk-performance.css?v=1"><script src="walk-performance.js?v=3"></script><link rel="stylesheet" href="visitor-help.css?v=1"><link rel="stylesheet" href="heritage-fonts.css?v=1"><link rel="stylesheet" href="heritage.css?v=2"></head>
<body class="heritage" data-location="museum">
<main id="school-museum" class="museum-root">
 <header class="museum-heading"><a class="museum-home" href="./" aria-label="Вернуться к выбору мест"><span data-icon="back"></span></a><a class="museum-brand" href="./" aria-label="Школьный музей Мухавца"><span class="brand-mark" data-icon="museum" aria-hidden="true"></span><span>Мухавец<small>Школьный музей</small></span></a><a class="museum-monument-link" href="monument.html?v=20261022g">Памятник</a><div class="museum-modes" aria-label="Режим просмотра"><button data-mode="walk" aria-pressed="true">Прогулка</button><button data-mode="overview" aria-pressed="false">Вся модель</button></div><button class="icon-button" data-action="fullscreen" aria-label="На весь экран" title="На весь экран">⛶</button></header>
 <section class="museum-stage" aria-label="Прогулка по музею">
  <canvas tabindex="0" aria-label="Трёхмерный музей. Мышь или палец — обзор, WASD — движение."></canvas>
  <div class="museum-loading" role="status"><span class="loading-mark">М</span><h1>Школьный музей Мухавца</h1><p>Открываем двери… <span class="load-progress">0%</span></p><progress max="100" value="0"></progress></div>

  <div class="museum-zoom" hidden><button data-action="zoom-in" aria-label="Приблизить модель">+</button><button data-action="zoom-out" aria-label="Отдалить модель">−</button></div>
 </section>
 <footer class="museum-explore"><label class="museum-select-label"><span>Экспозиции</span><select class="museum-exhibits" aria-label="Выбрать экспозицию"></select></label><button class="go-button" data-action="go">Подойти</button><button class="primary-button" data-action="photos"><span class="desktop-label">Рассмотреть </span>Фотографии</button><button class="export-button" data-action="export" hidden>Скачать модель</button></footer>
