<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#152923"><meta name="description" content="Прогулка по школьному музею Мухавца. История края, память о войне и предметы повседневной жизни."><title>Школьный музей Мухавца — прогулка</title><link rel="stylesheet" href="museum.css"></head>
<body>
<main id="school-museum" class="museum-root">
 <header class="museum-heading"><a class="museum-brand" href="./" aria-label="Школьный музей Мухавца"><span class="brand-mark" aria-hidden="true">М</span><span>Школьный музей<small>Мухавец</small></span></a><div class="museum-modes" aria-label="Режим просмотра"><button data-mode="walk" aria-pressed="true">Прогулка</button><button data-mode="overview" aria-pressed="false">Вся модель</button></div><button class="icon-button" data-action="fullscreen" aria-label="На весь экран" title="На весь экран">⛶</button></header>
 <section class="museum-stage" aria-label="Прогулка по музею">
  <canvas tabindex="0" aria-label="Трёхмерный музей. Мышь или палец — обзор, WASD — движение."></canvas>
  <div class="museum-loading" role="status"><span class="loading-mark">М</span><h1>Школьный музей Мухавца</h1><p>Открываем двери… <span class="load-progress">0%</span></p><progress max="100" value="0"></progress></div>
  <div class="museum-status" aria-live="polite">Внутри музея</div>
  <div class="museum-move"><div class="museum-joystick" role="group" aria-label="Джойстик: удерживайте и ведите палец в направлении движения"><span class="joystick-ring" aria-hidden="true"></span><span class="joystick-knob" aria-hidden="true"></span><span class="joystick-label">ИДТИ</span></div><div class="keyboard-hint"><kbd>W</kbd><span><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span></div></div>
  <div class="museum-hint">Мышь — обзор · WASD — идти · нажмите на стенд</div>
  <div class="museum-zoom" hidden><button data-action="zoom-in" aria-label="Приблизить модель">+</button><button data-action="zoom-out" aria-label="Отдалить модель">−</button></div>
 </section>
 <footer class="museum-explore"><label class="museum-select-label"><span>Экспозиции</span><select class="museum-exhibits" aria-label="Выбрать экспозицию"></select></label><button class="go-button" data-action="go">Подойти</button><button class="primary-button" data-action="photos"><span class="desktop-label">Рассмотреть </span>Фотографии</button><button class="export-button" data-action="export" hidden>Скачать модель</button></footer>
 <dialog class="museum-detail" aria-labelledby="detail-title"><div class="museum-detail-head"><div><div class="museum-detail-tag"></div><h2 class="museum-detail-title" id="detail-title"></h2></div><button class="icon-button" data-action="close" aria-label="Закрыть фотографии">×</button></div><div class="museum-image-wrap"><img class="museum-photo" alt=""><div class="photo-loading" hidden>Загружаем фотографию…</div></div><div class="museum-photo-nav"><button data-photo="-1" aria-label="Предыдущая фотография">←</button><span class="museum-count" aria-live="polite"></span><button data-photo="1" aria-label="Следующая фотография">→</button><span class="museum-source"></span></div><p class="museum-detail-text"></p></dialog>
 <noscript>Для интерактивной прогулки включите JavaScript в браузере.</noscript>
</main>
<script src="three.min.js"></script><script src="museum.js?v=5"></script><script src="boot.js?v=5"></script>
</body></html>
